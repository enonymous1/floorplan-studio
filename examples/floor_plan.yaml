# Floor Plan Data File
# This YAML file defines the floor plan layout including rooms, doors, windows, and boundary.
# All measurements are in feet (as defined in floor_plan_style.yaml).
# The coordinate system: (0,0) is bottom-left, x increases right, y increases up.
# Scaling and rendering settings are controlled in floor_plan_style.yaml.
#
# South (y = 0) is the street side, with the Covered Porch
# outside it; north (top) is the rear, with the Patio
# outside it. Neither the Porch nor the Patio is a room
# here: they are exterior, and the front door opens to
# the Porch while the Kitchen patio door opens to the
# Patio. Sample only, not a construction plan: rooms are
# rectangles, so fixtures, islands and reach-in closets
# are not modelled as separate rooms.

# Boundary: the union outline of the rooms. The Garage
# sits east of the house and is north-aligned, so the
# boundary steps in at y = 10.5 (the Garage south wall)
# and the south-east corner (x 44-68, y 0-10.5) is
# outside, driveway apron, not enclosed.
boundary:
  - [0, 0]      # House south-west corner (street side)
  - [44, 0]     # House south-east corner
  - [44, 10.5]  # Step out at the Garage south wall
  - [68, 10.5]  # Garage south-east corner
  - [68, 34.5]  # Garage / house north-east corner (rear)
  - [0, 34.5]   # House north-west corner

# Rooms: List of rooms in the floor plan.
# Each room has:
# - name: String identifier
# - rect: [x, y, width, height] - position and size in feet
# - doors: Optional list of door positions as [start_pos, end_pos]
# - windows: Optional list of window positions as [start_pos, end_pos]
#
# Layout, after the reference plan the user supplied
# (68 ft wide x 34 ft 6 in deep: Bedroom 3 and Bedroom 2
# 12'-0" x 11'-6", Great Room 17'-8" x 16'-0",
# Kitchen/Dining 17'-8" x 12'-6", Laundry 14'-0" x 8'-6",
# Master Bedroom 14'-0" x 12'-6", Two Car Garage
# 22'-0" x 24'-6"). Room sizes here are rounded to whole
# or half feet so the rectangles tile exactly — the
# reference's labels are interior clear sizes, so a foot
# or two of wall thickness accounts for the difference
# (e.g. centre rooms 18 ft wide against a 17'-8" label,
# Garage 24 ft wide against a 22'-0" label, the other
# dimension of which is its 24'-6" depth).
#
# Two corrections to the previous sample, both taken
# straight from the reference:
#
# 1. No long dead-end hallway. The previous sample's Hall
# was a 5 x 24 ft spur off the Living Room, ending at
# Bedroom 2. Here the Hall is a small 4 x 11.5 ft
# junction east of the Bathroom, between Bedroom 3
# (north) and Bedroom 2 (south). It has five openings:
# north to Bedroom 3, south to Bedroom 2, west to the
# Bathroom, east to the Great Room (a door), and east
# to the Kitchen/Dining (a cased opening, swing "none").
# You pass through it between the Great Room and the
# Kitchen; it does not dead-end at a bedroom.
#
# 2. No walking through a closet to reach a bathroom.
# The previous sample ran Primary Bedroom -> Closet ->
# Bath in series. Here the Master Bedroom has two
# separate doors on its north wall: one to the Walk-in
# Closet, one to the Master Bath. Both rooms are
# directly off the bedroom, and they share no door
# with each other.
#
# The Great Room and Kitchen/Dining are one open space
# in the reference, with no wall between them at all.
# They are two rectangles here only because the format
# needs rectangles, so the opening between them is
# 14 ft wide (swing "none"), not a 3 ft doorway.
#
# Circulation, read before editing: every room draws its own
# walls, so a door between two rooms must be listed in BOTH
# rooms, or one side's wall draws straight across the gap.
# The two listings use opposite swing flags so the leaf and arc
# match: "in" for the room the door swings into, "out" for the
# other room. A door listed in only one room, or a bedroom door
# on a wall shared with another bedroom, is a broken plan, not
# a rendering quirk.
rooms:
  - name: Great Room
    rect: [12, 0, 18, 19]  # South-centre, entry from the Covered Porch (342 sq ft)
    doors:
      - pos: [[23, 0], [26, 0]]  # Front entrance, south wall, to the Covered Porch
        swing: in  # Swings into the Great Room
      - pos: [[14, 19], [28, 19]]  # Wide open passage to Kitchen/Dining (paired below)
        swing: none  # No leaf, no arc: 14 ft of open plan, not a doorway
      - pos: [[12, 13], [12, 16]]  # To the Hall (paired below)
        swing: in  # Swings into the Great Room (arc in the Great Room, as in the reference)
      - pos: [[30, 9], [30, 12]]  # To the Master Bedroom (paired below)
        swing: out  # Swings into the Master Bedroom
    windows:
      - pos: [[14, 0], [18, 0]]  # South window, west of the front door

  - name: Kitchen/Dining
    rect: [12, 19, 18, 15.5]  # North-centre, open to the Great Room (279 sq ft)
    doors:
      - pos: [[14, 19], [28, 19]]  # Wide open passage to the Great Room
        swing: none
      - pos: [[12, 20], [12, 23]]  # Cased opening to the Hall (paired below)
        swing: none  # Dashed opening in the reference: no door, just the opening
      - pos: [[30, 28], [30, 31]]  # To the Laundry (paired below)
        swing: out  # Swings into the Laundry
      - pos: [[24, 34.5], [27, 34.5]]  # Patio door, north wall, to the Patio
        swing: in  # Swings into the Kitchen/Dining
    windows:
      - pos: [[14, 34.5], [18, 34.5]]  # North window, west of the patio door (above the sink)

  # Small junction hall (x 8-12, y 11.5-23): east of the
  # Bathroom, between Bedroom 3 and Bedroom 2. It is
  # 4 x 11.5 ft (46 sq ft), not a corridor down the house.
  # It connects the Great Room to the Kitchen/Dining, so
  # it is a through route, not a dead end.
  - name: Hall
    rect: [8, 11.5, 4, 11.5]
    doors:
      - pos: [[12, 13], [12, 16]]  # From the Great Room (paired above)
        swing: out  # Swings into the Great Room
      - pos: [[12, 20], [12, 23]]  # Cased opening to Kitchen/Dining
        swing: none
      - pos: [[8, 23], [11, 23]]  # To Bedroom 3 (paired below)
        swing: out  # Swings into Bedroom 3
      - pos: [[8, 11.5], [11, 11.5]]  # To Bedroom 2 (paired below)
        swing: out  # Swings into Bedroom 2
      - pos: [[8, 19], [8, 22]]  # To the Bathroom (paired below)
        swing: out  # Swings into the Bathroom
        # At the north end of the Bathroom's east wall, so
        # the leaf and arc stay clear of the Bathroom's
        # centred label.
    # No windows: an interior hall.

  - name: Bedroom 3
    rect: [0, 23, 12, 11.5]  # West, north (138 sq ft)
    doors:
      - pos: [[8, 23], [11, 23]]  # From the Hall (paired above)
        swing: in  # Swings into Bedroom 3
    windows:
      - pos: [[4, 34.5], [8, 34.5]]  # North window
    # The reference's reach-in closet sits on this room's
    # east wall, inside the 12 ft width — not a separate
    # room here, because the format's rooms are rectangles.

  - name: Bathroom
    rect: [0, 11.5, 8, 11.5]  # West, middle, shared bath (92 sq ft)
    doors:
      - pos: [[8, 19], [8, 22]]  # From the Hall (paired above)
        swing: in  # Swings into the Bathroom
    windows:
      - pos: [[0, 15], [0, 18]]  # West window

  - name: Bedroom 2
    rect: [0, 0, 12, 11.5]  # West, south (138 sq ft)
    doors:
      - pos: [[8, 11.5], [11, 11.5]]  # From the Hall (paired above)
        swing: in  # Swings into Bedroom 2
    windows:
      - pos: [[4, 0], [8, 0]]  # South window
    # Reach-in closet on the east wall, inside the 12 ft
    # width, as in Bedroom 3.

  - name: Master Bedroom
    rect: [30, 0, 14, 12.5]  # East-centre, south (175 sq ft)
    doors:
      - pos: [[30, 9], [30, 12]]  # From the Great Room (paired above)
        swing: in  # Swings into the Master Bedroom
      - pos: [[31, 12.5], [34, 12.5]]  # To the Closet (paired below)
        swing: out  # Swings into the Closet
      - pos: [[36, 12.5], [39, 12.5]]  # To the Master Bath (paired below)
        swing: out  # Swings into the Master Bath
        # Two separate doors on one wall, 2 ft of wall
        # between them — the Closet and the Bath share
        # no door, and neither is reached through the other.
    windows:
      - pos: [[34, 0], [38, 0]]  # South window

  - name: Closet
    rect: [30, 12.5, 5, 13.5]  # West of the Master Bath (68 sq ft)
    doors:
      - pos: [[31, 12.5], [34, 12.5]]  # From the Master Bedroom (paired above)
        swing: in  # Swings into the Closet
    # No windows: a closet, and its only door is to the
    # Master Bedroom — it is not a passage to the Bath.

  - name: Master Bath
    rect: [35, 12.5, 9, 13.5]  # East of the Closet (122 sq ft)
    doors:
      - pos: [[36, 12.5], [39, 12.5]]  # From the Master Bedroom (paired above)
        swing: in  # Swings into the Master Bath
    # No windows: an interior bath in the reference too
    # (Laundry north, Closet west, Master Bedroom south,
    # Garage east) — ventilated by fan, not modelled.

  - name: Laundry
    rect: [30, 26, 14, 8.5]  # East-centre, north (119 sq ft)
    doors:
      - pos: [[30, 28], [30, 31]]  # From Kitchen/Dining (paired above)
        swing: in  # Swings into the Laundry
      - pos: [[44, 30], [44, 33]]  # To the Garage (paired below)
        swing: out  # Swings into the Garage
    # No windows: none on the reference's Laundry north wall.

  - name: Garage
    rect: [44, 10.5, 24, 24]  # Two-car, east, north-aligned (576 sq ft)
    doors:
      - pos: [[44, 30], [44, 33]]  # From the Laundry (paired above)
        swing: in  # Swings into the Garage
      - pos: [[48, 10.5], [64, 10.5]]  # Double vehicle door, south wall
        swing: none  # Overhead door: a gap, no leaf, no arc
    # No windows: none on the reference's Garage.

# Suggestions for enhancement:
# - Add more room types: Pantry, Office, etc.
# - Include furniture or fixtures if needed for detailed plans
# - Add labels or notes for special features
# - Consider adding electrical outlets, plumbing fixtures for detailed plans
# - For multi-story homes, add floor levels
# - Units are assumed to be feet; if using metric, update floor_plan_style.yaml accordingly
