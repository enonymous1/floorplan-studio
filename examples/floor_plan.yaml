# Floor Plan Data File
# This YAML file defines the floor plan layout including rooms, doors, windows, and boundary.
# All measurements are in feet (as defined in floor_plan_style.yaml).
# The coordinate system: (0,0) is bottom-left, x increases right, y increases up.
# Scaling and rendering settings are controlled in floor_plan_style.yaml.

# Boundary: Defines the outer perimeter of the floor plan as a list of [x, y] points.
# The boundary should form a closed shape (first and last points connect).
# It follows the union outline of the rooms, so the Garage is inside
# it: the southeast corner below the Kitchen (x 20-32, y -10-0) is
# outside the house and is deliberately not enclosed. A rectangle
# here used to leave the Garage outside the boundary, so its bottom
# edge cut through the middle of the plan.
boundary:
  - [0, -10]    # Garage bottom-left corner
  - [20, -10]   # Garage bottom-right corner
  - [20, 0]     # Step in at the Garage / Living Room line
  - [32, 0]     # Bottom-right corner (Kitchen)
  - [32, 27]    # Top-right corner
  - [0, 27]     # Top-left corner

# Rooms: List of rooms in the floor plan.
# Each room has:
# - name: String identifier
# - rect: [x, y, width, height] - position and size in feet
# - doors: Optional list of door positions as [start_pos, end_pos]
# - windows: Optional list of window positions as [start_pos, end_pos]
#
# Layout pattern (typical small single-story, after the usual
# published patterns): open living/kitchen across the south
# half, bedrooms and bath clustered in the north half for
# privacy, and circulation kept to a minimum — a short
# central hall in the bedroom wing, not a corridor across
# the house. The previous sample's full-width 4 ft hallway
# (128 sq ft) was the strange part: it shrank the bedrooms
# to 8 ft deep. Here the hall is 6 x 7 ft (42 sq ft) and the
# bedrooms are 13 ft deep, in the usual ranges (primary
# ~160-190 sq ft, secondary ~120-140 sq ft).
#
# Circulation, read before editing: every room draws its own
# walls, so a door between two rooms must be listed in BOTH
# rooms, or one side's wall draws straight across the gap.
# The two listings use opposite swing flags so the leaf and arc
# match: "in" for the room the door swings into, "out" for the
# other room. A door listed in only one room, or a bedroom door
# on a wall shared with another bedroom, is a broken plan, not
# a rendering quirk — the previous sample had both.
rooms:
  - name: Living Room
    rect: [0, 0, 20, 14]  # Open plan with the Kitchen (south half)
    doors:
      - pos: [[0, 6], [0, 9]]  # Front entrance, west (exterior) wall
        swing: in  # Swings into the Living Room
      - pos: [[10, 0], [13, 0]]  # To the Garage (paired below)
        swing: in  # Swings into the Living Room
      - pos: [[15, 14], [18, 14]]  # To the Hall (paired below)
        swing: out  # Swings into the Hall
      - pos: [[20, 6], [20, 9]]  # Open passage to the Kitchen (paired below)
        swing: none  # No leaf, no arc: just the opening
    windows:
      - pos: [[0, 10], [0, 13]]  # West window, north of the front door

  - name: Kitchen
    rect: [20, 0, 12, 14]  # Open plan with the Living Room (south half)
    doors:
      - pos: [[20, 6], [20, 9]]  # Open passage to the Living Room
        swing: none
    windows:
      - pos: [[32, 4], [32, 11]] # East window

  # Short central hall in the bedroom wing (x 14-20, y 14-21):
  # it serves the two bedrooms and the bath, and nothing else.
  # It is entered from the Living Room; no room is reached
  # by walking through another bedroom or the bathroom.
  - name: Hall
    rect: [14, 14, 6, 7]
    doors:
      - pos: [[15, 14], [18, 14]]  # From the Living Room (paired above)
        swing: in  # Swings into the Hall
      - pos: [[14, 16], [14, 19]]  # To the Master Bedroom (paired below)
        swing: out  # Swings into the Master Bedroom
      - pos: [[20, 16], [20, 19]]  # To Bedroom 2 (paired below)
        swing: out  # Swings into Bedroom 2
      - pos: [[14, 21], [16.5, 21]]  # To the Bathroom (paired below)
        swing: out  # Swings into the Bathroom
        # At the west end of the wall, so the leaf and arc stay
        # clear of the Bathroom's centred label (a 3 ft door at
        # the centre of a 6 ft room drew straight through it).
    # No windows: an interior hall.

  - name: Master Bedroom
    rect: [0, 14, 14, 13]  # West of the Hall (182 sq ft)
    doors:
      - pos: [[14, 16], [14, 19]]  # From the Hall (paired above)
        swing: in  # Swings into the Master Bedroom
    windows:
      - pos: [[0, 17], [0, 23]]   # West window
      - pos: [[5, 27], [11, 27]]  # North window

  - name: Bathroom
    rect: [14, 21, 6, 6]  # At the end of the Hall (36 sq ft, hall bath)
    doors:
      - pos: [[14, 21], [16.5, 21]]  # From the Hall (paired above)
        swing: in  # Swings into the Bathroom
    windows:
      - pos: [[16, 27], [19, 27]] # North window

  - name: Bedroom 2
    rect: [20, 14, 12, 13]  # East of the Hall (156 sq ft)
    doors:
      - pos: [[20, 16], [20, 19]]  # From the Hall (paired above)
        swing: in  # Swings into Bedroom 2
    windows:
      - pos: [[32, 17], [32, 23]] # East window
      - pos: [[24, 27], [30, 27]] # North window

  - name: Garage
    rect: [0, -10, 20, 10]  # Below living room (negative y for basement/garage)
    doors:
      - pos: [[10, 0], [13, 0]]  # To the Living Room (paired above)
        swing: out  # Swings into the Living Room
      - pos: [[10, -10], [13, -10]] # Garage door, south (exterior) wall
        swing: out  # Swings out to the driveway
    # No windows in garage

# Suggestions for enhancement:
# - Add more room types: Dining Room, Laundry, Closets, etc.
# - Include furniture or fixtures if needed for detailed plans
# - Add labels or notes for special features
# - Consider adding electrical outlets, plumbing fixtures for detailed plans
# - For multi-story homes, add floor levels
# - Units are assumed to be feet; if using metric, update floor_plan_style.yaml accordingly