name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install renderer
        run: pip install -e "renderer[dev]"
      - name: Lint
        run: ruff check renderer/src renderer/tests
      - name: Test
        run: pytest renderer/tests -q
      - name: Render sample
        run: floorplan render examples/floor_plan.yaml --output-dir output

  editor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install
        working-directory: editor
        run: npm ci
      - name: Test
        working-directory: editor
        run: npm test
      - name: Syntax check
        working-directory: editor
        run: npm run check
      - name: CSS freshness
        working-directory: editor
        run: |
          npm run build:css
          git diff --exit-code dist/styles.css
