<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="floorplan-studio architecture: browser editor exports a plan file, the Python renderer loads it with a style file and writes SVG, PNG or PDF pages">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4f46e5; stroke-width: 2; rx: 12; }
      .box-alt { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 12; }
      .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #111827; }
      .line { font-family: sans-serif; font-size: 13px; fill: #374151; }
      .label { font-family: sans-serif; font-size: 12px; font-style: italic; fill: #4f46e5; }
      .caption { font-family: sans-serif; font-size: 13px; fill: #6b7280; }
    </style>
  </defs>
  <rect x="20" y="30" width="260" height="150" class="box"/>
  <text x="40" y="60" class="title">Browser editor</text>
  <text x="40" y="88" class="line">Canvas UI · toolbar · modals</text>
  <text x="40" y="110" class="line">state.js · drawing.js · utils.js</text>
  <text x="40" y="132" class="line">plan.js — canvas ↔ plan conversion</text>
  <text x="40" y="154" class="line">autosave to localStorage (plan shape)</text>

  <rect x="320" y="30" width="260" height="150" class="box-alt"/>
  <text x="340" y="60" class="title">Plan v1 — JSON / YAML</text>
  <text x="340" y="88" class="line">feet · bottom-left origin, y up</text>
  <text x="340" y="110" class="line">rooms · walls · openings</text>
  <text x="340" y="132" class="line">labels · dimensions · objects</text>
  <text x="340" y="154" class="line">the only coupling between halves</text>

  <rect x="620" y="30" width="260" height="150" class="box"/>
  <text x="640" y="60" class="title">Python renderer</text>
  <text x="640" y="88" class="line">data_loader → Plan / Room</text>
  <text x="640" y="110" class="line">drawing.py → matplotlib</text>
  <text x="640" y="132" class="line">outputs: SVG · PNG · PDF</text>
  <text x="640" y="154" class="line">+ settings + page-section pages</text>

  <line x1="280" y1="105" x2="315" y2="105" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="92" class="label">Export</text>
  <line x1="580" y1="105" x2="615" y2="105" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="582" y="92" class="label">load_plan</text>

  <rect x="620" y="220" width="260" height="90" class="box-alt"/>
  <text x="640" y="248" class="title">Style YAML</text>
  <text x="640" y="272" class="line">paper · scale · palette (@refs)</text>
  <text x="640" y="294" class="line">renderer-only input</text>
  <line x1="750" y1="220" x2="750" y2="185" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="758" y="208" class="label">style_loader</text>

  <text x="20" y="350" class="caption">Data flows one way: editor → plan → renderer. The editor never reads the style file, and neither half imports the other.</text>
</svg>
